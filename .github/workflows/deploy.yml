# Build du site statique et publication sur la branche `deploy`.
# Le Raspberry Pi surveille cette branche (timer systemd) et met en ligne
# automatiquement : aucun port entrant, aucun secret côté GitHub.
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

      - name: Publier le build sur la branche deploy
        working-directory: dist
        env:
          MSG: ${{ github.event.head_commit.message || 'manual' }}
        run: |
          touch .nojekyll
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ${GITHUB_SHA::7} — ${MSG%%$'\n'*}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
